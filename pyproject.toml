[project]
name = "soniscope"
version = "0.1.0"
description = "日观声记 SoniScope monorepo workspace 根（不直接声明 Worker 业务依赖）"
requires-python = ">=3.11"
# 根项目只引用本地 workspace 成员，业务依赖（oss / pydantic / pyyaml / typer / nls）
# 声明在 apps/worker/pyproject.toml，不在此处。
dependencies = ["soniscope-worker"]

[dependency-groups]
dev = [
    "mypy>=1.8",
    "ruff>=0.4",
    "pytest>=8.0",
    "types-pyyaml>=6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/worker"]

[tool.uv.sources]
soniscope-worker = { workspace = true }

[tool.mypy]
strict = true
python_version = "3.11"
# FC 共享模块 fc_shared（US-006）纳入 strict 检查；FC 函数 handler.py（apps/fc/<fn>/）
# 仍只受 ruff 检查（两个 handler.py 同名，避免 mypy 模块名冲突，沿用 US-005 约定）。
files = ["apps/worker/src", "apps/worker/tests", "apps/fc/shared", "apps/fc/tests"]
mypy_path = ["apps/worker/src", "apps/fc/shared"]
explicit_package_bases = true

# 云 SDK 为可选运行时依赖（lazy import，无类型 stub），verify-prep 等真实探针用到。
[[tool.mypy.overrides]]
module = [
    "alibabacloud_oss_v2.*",
    "alibabacloud_sts20150401.*",
    "alibabacloud_tea_openapi.*",
    "alibabacloud_fc20230330.*",
    "aliyunsdkcore.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/worker/src", "apps/worker/tests", "apps/fc/shared", "apps/fc/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["apps/worker/tests", "apps/fc/tests"]
# fc_shared 不作为已安装包，加入 sys.path 供 apps/fc/tests 导入。
pythonpath = ["apps/fc/shared"]
