[project]
name = "soniscope-worker"
version = "0.1.0"
description = "SoniScope Python Worker — OSS polling, audio standardization, cloud ASR transcription"
requires-python = ">=3.11"
dependencies = [
    "alibabacloud-oss-v2",
    "pyyaml",
    "pydantic>=2",
    "typer",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff",
    "pytest",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soniscope_worker"]
