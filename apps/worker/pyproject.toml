[project]
name = "soniscope-worker"
version = "0.1.0"
description = "日观声记 SoniScope Python Worker：轮询 OSS、标准化音频、云端 ASR、本地落盘"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
soniscope-worker = "soniscope_worker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soniscope_worker"]
