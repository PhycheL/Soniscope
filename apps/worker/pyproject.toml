[project]
name = "soniscope-worker"
version = "0.1.0"
description = "日观声记 SoniScope Python Worker：轮询 OSS、标准化音频、云端 ASR、本地落盘"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
    "alibabacloud-oss-v2>=1.3.1",
    "alibabacloud-sts20150401>=1.2.0",
    "alibabacloud-tea-openapi>=0.4.4",
    "aliyun-python-sdk-core>=2.16.0",
    "alibabacloud-fc20230330>=4.7.7",
]

[project.scripts]
soniscope-worker = "soniscope_worker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soniscope_worker"]
